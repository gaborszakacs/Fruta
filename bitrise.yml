---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
meta:
  bitrise.io:
    machine_type_id: g2.linux.medium
    stack: ubuntu-noble-24.04-bitrise-2025-android
pipelines:
  pipeline1:
    workflows:
      workflow1:
        uses: base_workflow
        inputs:
        - key1: value1
        - test_shard_index: 1
      workflow2:
        uses: base_workflow
        inputs:
        - key2: value2
        - test_shard_index: 11
workflows:
  base_workflow:
    steps:
    - script:
        title: Print env vars
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            echo "key1: $key1"
            echo "key2: $key2"
            echo "test_shard_index: $test_shard_index"
