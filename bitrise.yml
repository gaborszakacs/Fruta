format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
pipelines:
  pipeline1:
    workflows:
      workflow1:
        uses: base_workflow
        inputs:
        - key1: value1
      workflow2:
        uses: base_workflow
        inputs:
        - key2: value2      
workflows:
  base_workflow:
    steps:
      - script:
          title: Print env vars
          inputs:
            - content: |
                #!/bin/bash
                set -ex
                
                echo "key1: $key1"
                echo "key2: $key2"
